services:
  postgres:
    image: postgres:16-alpine
    container_name: scanpal-postgres
    environment:
      POSTGRES_USER: scanpal
      POSTGRES_PASSWORD: scanpal
      POSTGRES_DB: scanpal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanpal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scanpal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    container_name: scanpal-scheduler
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgres://scanpal:scanpal@postgres:5432/scanpal
      POLL_INTERVAL_MS: 60000
    depends_on:
      - postgres
      - redis

  uptime-poller:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: scanpal-uptime-poller
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgres://scanpal:scanpal@postgres:5432/scanpal
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL_MS: 60000
      MAINTENANCE_INTERVAL_MS: 21600000
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: scanpal-worker
    restart: unless-stopped
    command: ["pnpm", "--filter", "worker", "start"]
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgres://scanpal:scanpal@postgres:5432/scanpal
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  redis-data:
