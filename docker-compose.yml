services:
  postgres:
    image: postgres:16-alpine
    container_name: scanpal-postgres
    environment:
      POSTGRES_USER: scanpal
      POSTGRES_PASSWORD: scanpal
      POSTGRES_DB: scanpal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanpal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scanpal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
